# 一般設定與預設值（進 git，大家共用）。
# 機密（金鑰）不要寫在這裡，放 .env；部署時可用環境變數覆寫，例如 DEFAULTS_MEAL_MIN=120。

[tdx]
token_url = "https://tdx.transportdata.tw/auth/realms/TDXConnect/protocol/openid-connect/token"
api_url = "https://tdx.transportdata.tw/api"
request_interval_sec = 13   # 免費方案每分鐘 5 次

[defaults]
meal_min = 90   # 使用者沒給用餐時長時的假設值（輸出要標示為假設）
walk_min = 10   # 單段步行上限（分）
recall_k = 5    # 情境召回幾家
max_travel_min = 180  # 粗篩假設的最長車程（分）：出發後這段時間內到店都來不及用餐的店，不查公車就判不通過
max_results = 3 # 最多推薦幾家

[llm]
model = "gemini-3.6-flash"   # corpus/2_餐廳抽取.ipynb 用；金鑰 GEMINI_API_KEY 放 .env

[api]
host = "127.0.0.1"   # 部署（例如 AWS）時用環境變數 API_HOST=0.0.0.0 覆寫
port = 8000
